<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#132242" />
<title>NARA — Offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F6F8FC;color:#1A2233;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px}
  .card{max-width:340px}
  img{width:96px;height:96px;border-radius:24px}
  h1{font-size:20px;margin:16px 0 8px}
  p{color:#69728A;font-size:15px;line-height:1.5;margin:0 0 20px}
  button{background:#132242;color:#fff;border:0;border-radius:999px;padding:14px 28px;font-size:15px;font-weight:600;min-height:48px}
</style>
</head>
<body>
  <div class="card">
    <img src="assets/images/app-icon-192.png" alt="NARA" />
    <h1>Kamu sedang offline</h1>
    <p>Sambungkan internet lalu coba lagi. Halaman yang pernah dibuka bisa tetap diakses.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
